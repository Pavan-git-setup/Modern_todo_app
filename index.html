<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Modern Flow — Node.js To-Do</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app-layout">
    <!-- Main Card Container -->
    <main class="todo-card">
      <!-- Header -->
      <header class="app-header">
        <div class="header-left">
          <div class="brand-icon">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
              <path d="M12 2v20M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/>
            </svg>
          </div>
          <div>
            <h1>Task Flow</h1>
            <p id="currentDate" class="date-text"></p>
          </div>
        </div>

        <div class="header-right">
          <button id="themeToggleBtn" class="icon-btn" aria-label="Toggle theme" title="Toggle theme">
            <svg id="themeIcon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <circle cx="12" cy="12" r="5"></circle>
              <line x1="12" y1="1" x2="12" y2="3"></line>
              <line x1="12" y1="21" x2="12" y2="23"></line>
              <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line>
              <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
              <line x1="1" y1="12" x2="3" y2="12"></line>
              <line x1="21" y1="12" x2="23" y2="12"></line>
              <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line>
              <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>
            </svg>
          </button>
        </div>
      </header>

      <!-- Progress Section -->
      <section class="progress-section">
        <div class="progress-header">
          <span class="progress-label">Completion Status</span>
          <span id="progressPercentage" class="progress-val">0%</span>
        </div>
        <div class="progress-bar-bg">
          <div id="progressBarFill" class="progress-bar-fill" style="width: 0%;"></div>
        </div>
        <div class="stats-row">
          <div class="stat-badge"><span id="statTotal">0</span> Total</div>
          <div class="stat-badge"><span id="statActive">0</span> Active</div>
          <div class="stat-badge"><span id="statCompleted">0</span> Done</div>
        </div>
      </section>

      <!-- Task Creation Form -->
      <form id="createTaskForm" class="create-form">
        <div class="input-row">
          <input 
            type="text" 
            id="taskTextInput" 
            placeholder="Add a new task..." 
            autocomplete="off" 
            required 
          />
          <button type="submit" id="submitTaskBtn" class="primary-btn">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
              <line x1="12" y1="5" x2="12" y2="19"></line>
              <line x1="5" y1="12" x2="19" y2="12"></line>
            </svg>
            <span>Add Task</span>
          </button>
        </div>

        <!-- Optional Priority & Category selectors -->
        <div class="options-row">
          <div class="option-group">
            <label for="prioritySelect">Priority:</label>
            <select id="prioritySelect">
              <option value="low">🟢 Low</option>
              <option value="medium" selected>🟡 Medium</option>
              <option value="high">🔴 High</option>
            </select>
          </div>
          <div class="option-group">
            <label for="categorySelect">Category:</label>
            <select id="categorySelect">
              <option value="General" selected>General</option>
              <option value="Work">Work</option>
              <option value="Personal">Personal</option>
              <option value="Urgent">Urgent</option>
            </select>
          </div>
        </div>
      </form>

      <!-- Search & Filters Toolbar -->
      <section class="toolbar">
        <div class="search-box">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="11" cy="11" r="8"></circle>
            <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
          </svg>
          <input type="text" id="searchInput" placeholder="Search tasks..." autocomplete="off">
        </div>

        <div class="filter-pills">
          <button type="button" class="filter-pill active" data-filter="all">All</button>
          <button type="button" class="filter-pill" data-filter="active">Active</button>
          <button type="button" class="filter-pill" data-filter="completed">Completed</button>
        </div>
      </section>

      <!-- Task List Area -->
      <ul id="taskContainer" class="task-list">
        <!-- Injected via JavaScript -->
      </ul>

      <!-- Empty State -->
      <div id="emptyContainer" class="empty-state hidden">
        <div class="empty-icon">✨</div>
        <p class="empty-title">No tasks found</p>
        <p class="empty-desc">Create a new task above or adjust your search filters.</p>
      </div>

      <!-- Card Footer -->
      <footer class="card-footer">
        <span id="itemsLeftMsg" class="footer-msg">0 items left</span>
        <button type="button" id="clearDoneBtn" class="clear-done-btn">Clear completed</button>
      </footer>
    </main>

    <!-- Node Server Status Pill -->
    <div class="server-badge">
      <span class="pulse-dot"></span>
      <span>Node.js API Connected</span>
    </div>
  </div>

  <!-- Toast Container -->
  <div id="toast" class="toast hidden"></div>

  <!-- Application Logic -->
  <script>
    const API_BASE = '/api/todos';

    let todos = [];
    let currentFilter = 'all';
    let searchQuery = '';

    // DOM Elements
    const taskContainer = document.getElementById('taskContainer');
    const emptyContainer = document.getElementById('emptyContainer');
    const createTaskForm = document.getElementById('createTaskForm');
    const taskTextInput = document.getElementById('taskTextInput');
    const prioritySelect = document.getElementById('prioritySelect');
    const categorySelect = document.getElementById('categorySelect');
    const searchInput = document.getElementById('searchInput');
    const filterPills = document.querySelectorAll('.filter-pill');
    const clearDoneBtn = document.getElementById('clearDoneBtn');
    const itemsLeftMsg = document.getElementById('itemsLeftMsg');
    const currentDateEl = document.getElementById('currentDate');
    const themeToggleBtn = document.getElementById('themeToggleBtn');
    const progressBarFill = document.getElementById('progressBarFill');
    const progressPercentage = document.getElementById('progressPercentage');
    const statTotal = document.getElementById('statTotal');
    const statActive = document.getElementById('statActive');
    const statCompleted = document.getElementById('statCompleted');
    const toastEl = document.getElementById('toast');

    // Run immediately when script loads
    function init() {
      initTheme();
      renderDate();
      fetchTodos();
      setupEventListeners();
    }

    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', init);
    } else {
      init();
    }

    // Format today's date
    function renderDate() {
      const options = { weekday: 'long', month: 'short', day: 'numeric' };
      if (currentDateEl) {
        currentDateEl.textContent = new Date().toLocaleDateString(undefined, options);
      }
    }

    // Theme handling
    function initTheme() {
      const saved = localStorage.getItem('flow_theme');
      const prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
      const activeTheme = saved || (prefersDark ? 'dark' : 'light');
      setTheme(activeTheme);
    }

    function setTheme(theme) {
      document.documentElement.setAttribute('data-theme', theme);
      localStorage.setItem('flow_theme', theme);
      updateThemeIcon(theme);
    }

    function updateThemeIcon(theme) {
      const icon = document.getElementById('themeIcon');
      if (!icon) return;
      if (theme === 'dark') {
        icon.innerHTML = `<path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>`;
      } else {
        icon.innerHTML = `
          <circle cx="12" cy="12" r="5"></circle>
          <line x1="12" y1="1" x2="12" y2="3"></line>
          <line x1="12" y1="21" x2="12" y2="23"></line>
          <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line>
          <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
          <line x1="1" y1="12" x2="3" y2="12"></line>
          <line x1="21" y1="12" x2="23" y2="12"></line>
          <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line>
          <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>
        `;
      }
    }

    // Toast notification
    let toastTimer = null;
    function showToast(message) {
      if (!toastEl) return;
      toastEl.textContent = message;
      toastEl.classList.remove('hidden');
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => {
        toastEl.classList.add('hidden');
      }, 2200);
    }

    // Escape HTML
    function escapeHtml(str) {
      const div = document.createElement('div');
      div.textContent = str;
      return div.innerHTML;
    }

    // Relative time formatting
    function formatTime(isoString) {
      if (!isoString) return '';
      const date = new Date(isoString);
      const now = new Date();
      const diffHours = Math.round((now - date) / (1000 * 60 * 60));
      if (diffHours < 1) return 'Just now';
      if (diffHours === 1) return '1h ago';
      if (diffHours < 24) return `${diffHours}h ago`;
      return date.toLocaleDateString(undefined, { month: 'short', day: 'numeric' });
    }

    // Fetch todos from API
    async function fetchTodos() {
      try {
        const res = await fetch(API_BASE);
        if (!res.ok) throw new Error('API request failed');
        todos = await res.json();
        render();
      } catch (err) {
        console.warn('API fetch failed, falling back to local storage:', err);
        const local = localStorage.getItem('node_todo_backup');
        if (local) todos = JSON.parse(local);
        render();
      }
    }

    function updateLocalBackup() {
      localStorage.setItem('node_todo_backup', JSON.stringify(todos));
    }

    function updateStats() {
      const total = todos.length;
      const completed = todos.filter(t => t.completed).length;
      const active = total - completed;
      const percentage = total === 0 ? 0 : Math.round((completed / total) * 100);

      if (statTotal) statTotal.textContent = total;
      if (statActive) statActive.textContent = active;
      if (statCompleted) statCompleted.textContent = completed;
      if (progressPercentage) progressPercentage.textContent = `${percentage}%`;
      if (progressBarFill) progressBarFill.style.width = `${percentage}%`;

      if (itemsLeftMsg) itemsLeftMsg.textContent = `${active} ${active === 1 ? 'item' : 'items'} left`;
      if (clearDoneBtn) clearDoneBtn.style.visibility = completed > 0 ? 'visible' : 'hidden';
    }

    function render() {
      updateStats();
      updateLocalBackup();

      const filtered = todos.filter(t => {
        const matchesFilter = 
          currentFilter === 'all' ? true :
          currentFilter === 'active' ? !t.completed :
          t.completed;

        const matchesSearch = searchQuery 
          ? t.text.toLowerCase().includes(searchQuery.toLowerCase()) || 
            (t.category && t.category.toLowerCase().includes(searchQuery.toLowerCase()))
          : true;

        return matchesFilter && matchesSearch;
      });

      if (filtered.length === 0) {
        taskContainer.innerHTML = '';
        emptyContainer.classList.remove('hidden');
        return;
      }

      emptyContainer.classList.add('hidden');
      taskContainer.innerHTML = filtered.map(t => `
        <li class="task-item ${t.completed ? 'completed' : ''}" data-id="${t.id}">
          <div class="task-left">
            <div class="custom-checkbox" role="checkbox" aria-checked="${t.completed}">
              <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round">
                <polyline points="20 6 9 17 4 12"></polyline>
              </svg>
            </div>
            <div class="task-info">
              <span class="task-text">${escapeHtml(t.text)}</span>
              <div class="task-meta">
                ${t.category ? `<span class="badge badge-category">${escapeHtml(t.category)}</span>` : ''}
                <span class="badge badge-priority-${t.priority || 'medium'}">${t.priority || 'medium'}</span>
                <span class="task-time">${formatTime(t.createdAt)}</span>
              </div>
            </div>
          </div>
          <button class="delete-action-btn" aria-label="Delete task" title="Delete task">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <polyline points="3 6 5 6 21 6"></polyline>
              <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path>
            </svg>
          </button>
        </li>
      `).join('');
    }

    // Add task
    async function handleAddTask(e) {
      e.preventDefault();
      const text = taskTextInput.value.trim();
      const priority = prioritySelect.value;
      const category = categorySelect.value;

      if (!text) return;

      try {
        const res = await fetch(API_BASE, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ text, priority, category })
        });

        if (res.ok) {
          const newTodo = await res.json();
          todos.unshift(newTodo);
          showToast('✨ Task added');
        } else {
          throw new Error('Server error');
        }
      } catch (err) {
        // Fallback optimistic
        const fallbackTodo = {
          id: Date.now().toString(),
          text,
          priority,
          category,
          completed: false,
          createdAt: new Date().toISOString()
        };
        todos.unshift(fallbackTodo);
        showToast('Task saved locally');
      }

      taskTextInput.value = '';
      taskTextInput.focus();
      render();
    }

    // Toggle completion
    async function toggleTask(id) {
      const item = todos.find(t => t.id === id);
      if (!item) return;

      const nextState = !item.completed;
      item.completed = nextState;
      render();

      try {
        const res = await fetch(`${API_BASE}/${id}`, {
          method: 'PUT',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ completed: nextState })
        });
        if (res.ok) {
          showToast(nextState ? '✓ Task completed' : 'Task marked active');
        }
      } catch (err) {
        console.warn('API update failed:', err);
      }
    }

    // Delete task
    async function deleteTask(id) {
      todos = todos.filter(t => t.id !== id);
      render();
      showToast('🗑️ Task removed');

      try {
        await fetch(`${API_BASE}/${id}`, { method: 'DELETE' });
      } catch (err) {
        console.warn('API delete failed:', err);
      }
    }

    // Clear completed tasks
    async function clearCompleted() {
      todos = todos.filter(t => !t.completed);
      render();
      showToast('Cleared completed tasks');

      try {
        await fetch(`${API_BASE}/clear-completed`, { method: 'POST' });
      } catch (err) {
        console.warn('API clear failed:', err);
      }
    }

    // Setup Event Listeners
    function setupEventListeners() {
      createTaskForm.addEventListener('submit', handleAddTask);

      // List click delegation
      taskContainer.addEventListener('click', (e) => {
        const item = e.target.closest('.task-item');
        if (!item) return;
        const id = item.dataset.id;

        if (e.target.closest('.delete-action-btn')) {
          deleteTask(id);
        } else {
          toggleTask(id);
        }
      });

      // Filter tabs
      filterPills.forEach(pill => {
        pill.addEventListener('click', () => {
          filterPills.forEach(p => p.classList.remove('active'));
          pill.classList.add('active');
          currentFilter = pill.dataset.filter;
          render();
        });
      });

      // Search input
      searchInput.addEventListener('input', (e) => {
        searchQuery = e.target.value.trim();
        render();
      });

      // Clear completed button
      clearDoneBtn.addEventListener('click', clearCompleted);

      // Theme toggle button
      themeToggleBtn.addEventListener('click', () => {
        const current = document.documentElement.getAttribute('data-theme') || 'light';
        const next = current === 'dark' ? 'light' : 'dark';
        setTheme(next);
      });
    }
  </script>
</body>
</html>
